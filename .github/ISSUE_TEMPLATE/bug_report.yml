name: Bug report
description: Something is not working as expected. Every bug gets a regression test.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Today screen
        2. Swipe to option 2
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Dev
        - QA
        - Production
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, iOS version and app language
      placeholder: "iPhone 16 Pro · iOS 26.1 · pt-BR"
  - type: textarea
    id: regression
    attributes:
      label: Regression test idea
      description: Which test would have caught this bug? (unit, snapshot or UI)
