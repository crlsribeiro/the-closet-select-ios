name: PR checks

on:
  pull_request:
    branches: [main, qa, develop]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            docs
            chore
            ci
            perf
            build
            style
            revert

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          if find . -name '*.swift' -not -path './.build/*' | grep -q .; then
            swiftlint lint --strict --reporter github-actions-logging
          else
            echo "No Swift files yet, skipping."
          fi

  # Build, unit/acceptance/snapshot tests and the Sonar Quality Gate are added
  # together with the Xcode project in the Sprint 0 scaffold PR (macOS runner).
