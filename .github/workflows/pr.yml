name: CI

on:
  pull_request:
    branches: [main, qa, develop]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, qa, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            docs
            chore
            ci
            perf
            build
            style
            revert

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repository-checks:
    name: Repository regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test dependencies
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Pipeline and configuration regression tests
        run: python3 -m unittest discover -s scripts/tests -v

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: |
          if find . -name '*.swift' -not -path './.build/*' | grep -q .; then
            swiftlint lint --strict --reporter github-actions-logging
          else
            echo "No Swift files yet, skipping."
          fi

  packages-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Core
        run: swift test --force-resolved-versions --package-path Packages/Core
      - name: DesignSystem (platform-independent parts)
        run: swift test --force-resolved-versions --package-path Packages/DesignSystem

  ios:
    name: iOS build, tests and Sonar
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Only a boolean reaches the job; the token itself is scoped to the Sonar step.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test (Dev)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project TheClosetSelect.xcodeproj \
            -scheme TheClosetSelect-Dev \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: App coverage report
        run: |
          mkdir -p coverage
          scripts/coverage/xccov-to-sonar.sh TestResults.xcresult > coverage/app.xml
      - name: Package tests with coverage (macOS, includes SwiftUI parts)
        run: |
          for package in Core DesignSystem; do
            swift test --force-resolved-versions --package-path "Packages/$package" --enable-code-coverage
            bin=$(swift build --force-resolved-versions --package-path "Packages/$package" --show-bin-path)
            name=$(echo "$package" | tr '[:upper:]' '[:lower:]')
            xcrun llvm-cov export -format=lcov \
              -instr-profile "$bin/codecov/default.profdata" \
              "$bin/${package}PackageTests.xctest/Contents/MacOS/${package}PackageTests" \
              > "coverage/$name.lcov"
            python3 scripts/coverage/lcov-to-sonar.py "coverage/$name.lcov" "Packages/$package/Sources" \
              > "coverage/$name.xml"
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pipeline script tests with coverage
        env:
          COVERAGE_FILE: coverage/.coverage
        run: |
          python -m pip install --quiet pyyaml==6.0.2 coverage==7.17.5
          python -m coverage run --source=scripts -m unittest discover -s scripts/tests
          python -m coverage xml -o coverage/python.xml
      - name: SonarQube Cloud analysis and Quality Gate
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TestResults
          path: TestResults.xcresult

  # Danger is added in a next PR.
