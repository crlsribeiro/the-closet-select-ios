name: CI

on:
  pull_request:
    branches: [main, qa, develop]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, qa, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            docs
            chore
            ci
            perf
            build
            style
            revert

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repository-checks:
    name: Repository regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install --quiet pyyaml
      - name: Pipeline and configuration regression tests
        run: python3 -m unittest discover -s scripts/tests -v

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          if find . -name '*.swift' -not -path './.build/*' | grep -q .; then
            swiftlint lint --strict --reporter github-actions-logging
          else
            echo "No Swift files yet, skipping."
          fi

  packages-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Core
        run: swift test --package-path Packages/Core
      - name: DesignSystem (platform-independent parts)
        run: swift test --package-path Packages/DesignSystem

  ios:
    name: iOS build, tests and Sonar
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Only a boolean reaches the job; the token itself is scoped to the Sonar step.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test (Dev)
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project TheClosetSelect.xcodeproj \
            -scheme TheClosetSelect-Dev \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: App coverage report
        run: |
          mkdir -p coverage
          scripts/coverage/xccov-to-sonar.sh TestResults.xcresult > coverage/app.xml
      - name: Package tests with coverage (macOS, includes SwiftUI parts)
        run: |
          for package in Core DesignSystem; do
            swift test --package-path "Packages/$package" --enable-code-coverage
            bin=$(swift build --package-path "Packages/$package" --show-bin-path)
            name=$(echo "$package" | tr '[:upper:]' '[:lower:]')
            xcrun llvm-cov export -format=lcov \
              -instr-profile "$bin/codecov/default.profdata" \
              "$bin/${package}PackageTests.xctest/Contents/MacOS/${package}PackageTests" \
              > "coverage/$name.lcov"
            python3 scripts/coverage/lcov-to-sonar.py "coverage/$name.lcov" . "Packages/$package/Sources" \
              > "coverage/$name.xml"
          done
      - name: SonarQube Cloud analysis and Quality Gate
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  # Danger is added in a next PR.
