sonar.organization=carlosaoribeiro
sonar.projectKey=carlosaoribeiro_the-closet-select-ios
sonar.projectName=The Closet Select iOS

sonar.sourceEncoding=UTF-8
# Newer scanners analyze the whole repository and ignore sonar.sources/sonar.tests.
# Scope is controlled with exclusions instead.
sonar.exclusions=docs/**,**/*.md

# Generic coverage reports produced in CI (app via xccov, packages via llvm-cov)
sonar.coverageReportPaths=coverage/app.xml,coverage/core.xml,coverage/designsystem.xml
sonar.python.coverage.reportPaths=coverage/python.xml
sonar.python.version=3.12

# Presentation-only SwiftUI code is verified by snapshot tests, not unit coverage (docs/TESTING.md).
sonar.coverage.exclusions=\
  AppTests/**,\
  **/Tests/**,\
  scripts/tests/**,\
  Package.swift,\
  **/Package.swift,\
  App/Sources/TheClosetSelectApp.swift,\
  **/*View.swift,\
  Packages/DesignSystem/Sources/DesignSystem/AuraColor.swift,\
  Packages/DesignSystem/Sources/DesignSystem/AuraGlass.swift,\
  Packages/DesignSystem/Sources/DesignSystem/Skeleton.swift

# Tests are allowed to repeat setup code.
sonar.cpd.exclusions=AppTests/**,**/Tests/**,scripts/tests/**

# SwiftLint is the source of truth for style; Sonar focuses on bugs, vulnerabilities and smells.
sonar.qualitygate.wait=true
